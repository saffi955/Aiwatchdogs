name: probe-models

# Manual: lists and test-calls every model the provider keys can reach, then
# commits data/probe.json. Run it from the Actions tab when choosing models.
# Note it spends ~20 of OpenRouter's 50 free requests for that day.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Probe providers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python tools/probe_models.py
      - name: Commit probe results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/probe.json
          git commit -m "probe models $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push
