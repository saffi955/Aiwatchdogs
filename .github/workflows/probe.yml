name: probe-models

# One-off: lists and test-calls every model the provider keys can reach, then
# commits data/probe.json. Runs on pushes to claude/** branches that touch the
# probe, or manually.
on:
  push:
    branches: ["claude/**"]
    paths: ["tools/probe_models.py", ".github/workflows/probe.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Probe providers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TITHUB_MODELS_API_KEY: ${{ secrets.TITHUB_MODELS_API_KEY }}
        run: python tools/probe_models.py
      - name: Commit probe results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/probe.json
          git commit -m "probe models $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push
