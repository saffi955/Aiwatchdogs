# Model Drift Watchdog — configuration
# Everything the watchdog watches and how it scores drift lives here.
# Add a model = add a list entry. Add a new provider family = add an adapter in
# src/providers/ and reference it by `provider:`. No other code changes.
#
# `env_key` names the environment variable / GitHub secret holding that
# provider's API key. Keys are NEVER stored here.

run:
  system_prompt: "You are a helpful assistant."   # neutral, so verbosity tests
                                                  # measure true default
                                                  # chattiness; determinism comes
                                                  # from temperature 0.
  temperature: 0
  max_tokens: 8192      # output cap per reply. High enough that reasoning models
                        # (gpt-oss, qwen3, gemini 3.x thinking) never get cut off
                        # mid-answer; normal replies to these prompts use far less.
                        # A model entry can override it with its own max_tokens.
  timeout_s: 120        # long replies from reasoning models need more than 30s
  retries: 3            # transport retries; an API error is NOT counted as drift
  retry_backoff_s: 2    # exponential: 2s, 4s, 8s ...
  request_delay_s: 1.5  # pause between prompts to respect free-tier rate limits

scoring:
  weights:              # composite drift score; must sum to 1.0
    format_compliance: 0.25
    instruction_following: 0.20
    classification_stability: 0.20
    math_reasoning: 0.15
    extraction_accuracy: 0.10
    refusal_boundary: 0.10
  baseline_days: 14              # rolling window for "normal"
  calibration_days: 3            # first N days: record only, never alert
  drift_drop_threshold: 15       # alert if score falls this far below baseline
  category_collapse_threshold: 50  # alert if any single category drops below this
                                   # AND drift_drop_threshold below its own usual score
  consecutive_breaches: 2        # require N breaching runs in a row before alert
  verbosity_z_threshold: 2.0     # |z| beyond this applies a -5 penalty
  latency_z_threshold: 2.0       # z beyond this applies a -5 penalty
  penalty_points: 5

alerting:
  discord: true                  # requires DISCORD_WEBHOOK_URL secret
  heartbeat: true                # post a per-run summary to Discord EVERY run
                                 # (all-clear + any drift), not only on breach.
                                 # A run with no breach still pings, so you always
                                 # know the watchdog — and the webhook — are alive.

# Models to watch. Watching a moving alias alongside a pinned version is the
# "proven silent swap" signal: if the alias drifts but the version doesn't, the
# provider quietly re-pointed the alias.
#
# Every model below was live-tested with the repo's keys on 2026-09-26 (see
# data/probe.json, produced by tools/probe_models.py). No model appears twice:
# where a model is on several providers it is watched on the one with the most
# free quota. GitHub Models was retired by GitHub on 2026-07-30 and is gone.
# A wrong or retired id is recorded as an ERROR (never drift) — a one-line fix.
models:
  # --- Google AI Studio (free tier, GEMINI_API_KEY) ----------------------
  # Free quota is per model, so adding models does not starve the others.
  # Flash-Lite and Gemma have enough free daily quota for 4 full runs a day.
  - name: gemini-flash-lite (alias)
    provider: gemini
    model_id: gemini-flash-lite-latest
    env_key: GEMINI_API_KEY
    watch: true

  - name: gemini-3.1-flash-lite (version)
    provider: gemini
    model_id: gemini-3.1-flash-lite
    env_key: GEMINI_API_KEY
    watch: true

  - name: gemini-3.5-flash-lite
    provider: gemini
    model_id: gemini-3.5-flash-lite
    env_key: GEMINI_API_KEY
    watch: true

  - name: gemma-4-26b
    provider: gemini
    model_id: gemma-4-26b-a4b-it
    env_key: GEMINI_API_KEY
    watch: true

  # Not watched: the non-lite Flash models (gemini-flash-latest, 3-flash-preview,
  # 3.5/3.6/3.7/3.8-flash). They answer, but their free quota is only ~20
  # requests/day per model, less than one 38-prompt suite: a live run on
  # 2026-09-26 got 0-21 answers each before HTTP 429. They need a paid key.
  # Also not watched: gemini-pro-latest / 3.1-pro (free quota is 0, always 429),
  # gemini-2.5-* (retired, 404), gemma-4-31b (HTTP 500 on test), previews that
  # duplicate a GA model, and TTS / image / audio / Interactions-API-only models.

  # --- Groq (free tier, GROQ_API_KEY) ------------------------------------
  # These are every chat model on Groq's current catalog. The old llama-3.3-70b,
  # kimi-k2 and deepseek-r1-70b rows were removed from Groq.
  - name: groq-gpt-oss-120b
    provider: openai_compat
    model_id: openai/gpt-oss-120b
    base_url: https://api.groq.com/openai/v1
    env_key: GROQ_API_KEY
    watch: true

  - name: groq-gpt-oss-20b
    provider: openai_compat
    model_id: openai/gpt-oss-20b
    base_url: https://api.groq.com/openai/v1
    env_key: GROQ_API_KEY
    watch: true

  - name: groq-qwen3.8-27b
    provider: openai_compat
    model_id: qwen/qwen3.8-27b
    base_url: https://api.groq.com/openai/v1
    env_key: GROQ_API_KEY
    watch: true

  # --- OpenRouter (free models, OPENROUTER_API_KEY) ----------------------
  # The key is on OpenRouter's free tier: 50 requests/DAY shared across ALL
  # ":free" models. One full suite is 38 requests, so only ONE model can run,
  # once a day (max_runs_per_day: 1). With $10+ of OpenRouter credit the cap
  # becomes 1000/day: then drop max_runs_per_day and add more rows, e.g.
  # nvidia/nemotron-3-super-120b-a12b:free, poolside/laguna-s-2.1:free,
  # cohere/north-mini-code:free, liquid/lfm-2.5-2.6b:free (all passed the probe).
  - name: openrouter-nemotron-3-ultra-550b (free)
    provider: openai_compat
    model_id: nvidia/nemotron-3-ultra-550b-a55b:free
    base_url: https://openrouter.ai/api/v1
    env_key: OPENROUTER_API_KEY
    max_runs_per_day: 1
    watch: true

  # --- Cloudflare Workers AI (free, CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID)
  # Free tier: 10,000 neurons/day (about $0.11). At this suite's size (~70 input
  # and ~25-100 output tokens per prompt, 152 prompts/day per model) the six
  # models below use roughly 4,000 neurons/day together. Picked for popularity,
  # skipping anything already watched elsewhere (gpt-oss, qwen3.8, gemma-4,
  # nemotron). Not watched: DeepSeek-R1 distill (its long reasoning would eat
  # the neuron budget), and DeepSeek V4 / Kimi K2 / GLM 5.x (paid only, 403).
  - name: cloudflare-llama-3.3-70b
    provider: openai_compat
    model_id: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
    base_url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1
    env_key: CLOUDFLARE_API_TOKEN
    watch: true

  - name: cloudflare-llama-4-scout
    provider: openai_compat
    model_id: "@cf/meta/llama-4-scout-17b-16e-instruct"
    base_url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1
    env_key: CLOUDFLARE_API_TOKEN
    watch: true

  - name: cloudflare-llama-3.1-8b
    provider: openai_compat
    model_id: "@cf/meta/llama-3.1-8b-instruct-fp8"
    base_url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1
    env_key: CLOUDFLARE_API_TOKEN
    watch: true

  - name: cloudflare-mistral-small-3.1-24b
    provider: openai_compat
    model_id: "@cf/mistralai/mistral-small-3.1-24b-instruct"
    base_url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1
    env_key: CLOUDFLARE_API_TOKEN
    watch: true

  - name: cloudflare-glm-4.7-flash
    provider: openai_compat
    model_id: "@cf/zai-org/glm-4.7-flash"
    base_url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1
    env_key: CLOUDFLARE_API_TOKEN
    watch: true

  - name: cloudflare-qwen3-30b
    provider: openai_compat
    model_id: "@cf/qwen/qwen3-30b-a3b-fp8"
    base_url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1
    env_key: CLOUDFLARE_API_TOKEN
    watch: true
